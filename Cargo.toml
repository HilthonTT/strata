[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
default-members = ["crates/strata"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/HilthonTT/strata"
homepage = "https://github.com/HilthonTT/strata"
authors = ["HilthonTT"]

[workspace.dependencies]
# Path crates carry a version so they can be published; keep it in step
# with workspace.package.version.
strata-core = { path = "crates/strata-core", version = "0.1.0" }
strata-config = { path = "crates/strata-config", version = "0.1.0" }
strata-plugin = { path = "crates/strata-plugin", version = "0.1.0" }
strata-sys = { path = "crates/strata-sys", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ratatui = "0.30"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
mlua = { version = "0.12", features = ["lua54", "vendored"] }
nucleo-matcher = "0.3"
walkdir = "2"
trash = "5"
ssh2 = "0.9"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
tempfile = "3"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
similar = "3"
zip = { version = "2", default-features = false, features = ["deflate-flate2", "flate2", "lzma", "aes-crypto"] }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rs = "0.3"
ruzstd = "0.9"
keyring = "4"
notify = "8"
regex = "1"
xattr = "1"
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "hooks"] }
yaml-rust2 = { version = "0.13", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
