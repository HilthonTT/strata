# strata configuration — every setting is optional.
# Location: ~/.config/strata/config.toml (or $STRATA_CONFIG_DIR)

# Directories pinned in the sidebar (also toggled with `P`).
pinned = []

[general]
theme = "strata"   # `strata --list-themes`, or press T inside strata
keymap = "vim"               # vim (y y, d d, g g…) | default (ctrl+c, ctrl+x, ctrl+v… like superfile)
transparent = false          # use the terminal background
show_hidden = false
hide_gitignored = false      # leave out what git ignores (toggle with `z i` / alt+i)
panels = 2                   # file panels opened at start
preview = true
image_preview = true
image_protocol = "auto"      # auto | kitty | sixel | iterm2 | halfblocks; force one when auto picks badly
auto_grid = true             # folders of mostly images or videos open as a thumbnail grid (`z g` / alt+v toggles)
grid_tile_width = 22         # columns per grid tile; tiles stretch to fill the panel
syntax_highlight = true      # colour code in the preview
git_status = true            # git markers next to files (M, A, ?, !…)
dir_sizes = false            # measure folders and show their sizes (toggle with `d c`)
extra_columns = 0            # 0 = names only, 1 = + size, 2 = + date, 3 = + permissions
preview_border = false
line_numbers = false         # line numbers in text previews
sidebar = true
footer = true
icons = true                 # needs a Nerd Font
mouse = true                 # clicks, right-click menu, drag and drop; false leaves the mouse to the terminal
border = "rounded"           # plain | rounded | double | thick
# border_chars = { top_left = "┌", top_right = "┐", bottom_left = "└", bottom_right = "┘", top = "─", bottom = "─", left = "│", right = "│" }
sidebar_width = 24           # columns
sidebar_sections = ["places", "pinned", "disks", "network", "tags"]   # which sections, in order
preview_width = 0            # % of the window; 0 = automatic
name_percent = 0             # % of a panel kept for names before extra columns hide; 0 = automatic
sort = "name"                # name | size | modified | extension
sort_reverse = false         # descending order
case_sensitive_sort = false  # sort B before a
dirs_first = true
use_trash = true             # `d d` trashes; `D` always deletes permanently
confirm_delete = true
editor = ""                  # defaults to $VISUAL / $EDITOR / vi
dir_editor = ""              # opens the current directory (E); defaults to editor
opener = ""                  # defaults to xdg-open / open / start
cd_on_quit = false           # cd your shell on every quit, not just Q (see `strata --shell-init`)
restore_session = false      # reopen the last tabs and panels when started without paths
default_layout = ""          # layout (:layout save <name>) opened when started without paths; wins over restore_session
start_dir = ""               # directory opened when no paths are given; empty = current directory
page_size = 0                # rows moved by page up/down; 0 = a full page
si_units = false             # sizes in kB/MB (1000) instead of KiB/MiB (1024)
shell_close_on_success = false  # skip "press enter" after a `!` command that succeeds
elevate = ""                 # runs operations refused for lack of permission as root (:sudo); empty = sudo
verify_copies = false        # read copies back and compare checksums (local destinations; slower)
bandwidth_limit = ""          # cap each copy job, e.g. "10M" or "512K" (per second); empty = unlimited; :limit changes it
clipboard = ""               # program fed copied text, e.g. "wl-copy"; empty = detect, then OSC 52; "osc52" = terminal only
check_updates = false        # look for a newer release on GitHub, at most once a day
remote_control = true        # let `strata --remote` drive this instance through a private socket (Unix)
md5_checksum = false         # show the MD5 of the hovered file (reads the whole file)
sha256_checksum = false      # show the SHA-256 of the hovered file (reads the whole file)
markdown_preview = true      # render Markdown in the preview (false = highlighted source)
hex_preview = true           # hex dump of binary files in the preview
data_preview = true          # CSV tables, JSON/YAML/TOML outlines, SQLite tables
media_preview = true         # PDF pages, video frames and media details (needs poppler-utils / ffmpeg)
browse_archives = true       # enter zip and tar archives like directories (read-only)
diff_tool = ""               # program for `compare` (C) on two local files, e.g. "nvim -d"; empty = built-in diff
date_format = "%Y-%m-%d %H:%M"
metrics_interval_ms = 1000

# Key overrides. Values are action names (see `?` in strata) or
# `:commands` from the command palette.
[keys]
# "ctrl+c" = "copy"
# "g p" = ":cd ~/projects"

[plugins]
enabled = ["git", "bookmarks", "archive", "zoxide"]   # official plugins
disabled = []                                          # user plugins to skip

# [plugins.options.git]
# panel = true

# Programs per file extension, used by enter and `o`. The file path is
# appended. Plain strings run in the terminal; detach = true starts GUI apps
# in the background.
[open_with]
# md = "glow -p"
# png = { command = "feh", detach = true }
# pdf = { command = "zathura", detach = true }

# Connections. Protocols: smb, nfs, sftp, s3, webdav, ftp, rclone.
# smb and nfs are mounted; the others are browsed in strata. s3, webdav,
# ftp and rclone need the rclone tool (https://rclone.org/install/).
# Hosts in ~/.ssh/config are listed too, and an sftp host that is an alias
# there takes its HostName, User, Port and IdentityFile from it.
# [[connections]]
# name = "nas"
# protocol = "smb"
# host = "192.168.0.10"       # IPv4, IPv6 or hostname
# share = "media"
# user = "me"
# auto_connect = false
#
# [[connections]]
# name = "backup"
# protocol = "sftp"
# host = "nas.local"
# share = "/volume1"          # start directory
# user = "me"
# identity_file = "~/.ssh/id_ed25519"
#
# [[connections]]
# name = "backups"
# protocol = "s3"
# host = "s3.amazonaws.com"   # or your MinIO / R2 / B2 endpoint
# share = "/my-bucket/daily"  # bucket and start prefix
# user = "AKIA..."            # access key; the secret goes in the keychain
#                             # (:password backups). Leave both out to use
#                             # AWS_* variables or ~/.aws profiles (EC2
#                             # instance roles need AWS_EC2_METADATA_DISABLED=false).
#
# [[connections]]
# name = "cloud"
# protocol = "webdav"
# host = "cloud.example.com"
# share = "/remote.php/dav/files/me"
# user = "me"
# tls = true                  # false for plain http
#
# [[connections]]
# name = "mirror"
# protocol = "ftp"
# host = "ftp.example.org"
# share = "/pub"
# tls = false                 # true for FTPS
#
# [[connections]]
# name = "drive"
# protocol = "rclone"
# host = "gdrive"             # a remote from `rclone config`
# share = "/Photos"
