[package]
name = "strata"
description = "A fast, extensible terminal file explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[features]
default = ["sftp", "sqlite"]
sftp = ["strata-core/sftp"]
# Tables of SQLite databases in the preview (builds SQLite from source).
sqlite = ["dep:rusqlite"]

[dependencies]
strata-core.workspace = true
strata-config.workspace = true
strata-plugin.workspace = true
strata-sys.workspace = true
anyhow.workspace = true
ratatui.workspace = true
ratatui-image.workspace = true
image.workspace = true
clap.workspace = true
unicode-width.workspace = true
chrono.workspace = true
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
zip.workspace = true
dirs.workspace = true
syntect.workspace = true
notify.workspace = true
rusqlite = { workspace = true, optional = true }
yaml-rust2.workspace = true
toml.workspace = true
